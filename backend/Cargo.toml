[package]
name = "admin"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[[bin]]
name = "admin"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }

sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "chrono",
    "macros",
    "migrate",
] }

uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# opaque tokens + password hashing
rand = "0.9"
base64 = "0.23"
sha2 = "0.10"
hex = "0.4"
argon2 = "0.5"

# signed calls to tenant deployments
ed25519-dalek = "3"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

# password reset and invitation emails over SMTP, rustls with bundled roots
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "pool", "builder", "hostname", "tokio1-rustls-tls"] }

# shared rate-limit counters
redis = { version = "1", default-features = false, features = ["tokio-comp", "connection-manager"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
